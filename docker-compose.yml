version: '3.8'

services:
  # PostgreSQL 데이터베이스
  postgres:
    image: postgres:15-alpine
    container_name: helper-db
    environment:
      POSTGRES_DB: chat_history
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U username -d chat_history"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - helper-network

  # 라이언 헬퍼 앱
  app:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64  # 윈도우/인텔맥
        - linux/arm64  # 애플 실리콘
    container_name: helper-app
    environment:
      # 데이터베이스 설정
      DATABASE_URL: postgresql://username:password@postgres:5432/chat_history
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: chat_history
      DB_USER: username
      DB_PASSWORD: password
      
      # API 키 (환경 변수 또는 .env 파일에서 로드)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      
      # JWT 설정
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-this-in-production}
      
      # Google OAuth (선택사항)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      
      # 기타 설정
      USE_CLAUDE: "true"
      PORT: "8001"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # 로그 저장 (선택사항)
      - ./logs:/app/logs
    networks:
      - helper-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  helper-network:
    driver: bridge

